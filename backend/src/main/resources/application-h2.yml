# H2 内存库：无 Oracle 环境时的临时回退（进程结束即销毁）
app:
  datasource:
    mode: h2

spring:
  datasource:
    url: jdbc:h2:mem:lifecircle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      # 同样由 dbdiagram.io 导出的脚本建表，不使用 Hibernate 自动建表
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
  h2:
    console:
      enabled: true

persistence:
  schema-script: classpath:db/schema-dbml-h2.sql