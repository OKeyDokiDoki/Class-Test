server:
  port: 8080

spring:
  application:
    name: life-circle-backend
  datasource:
    url: jdbc:h2:mem:lifecircle;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
