server:
  port: 8080

spring:
  application:
    name: life-circle-backend
  profiles:
    # 默认使用 Oracle 作为物理数据库（application-oracle.yml）。
    # 无 Oracle 环境时可用 -Dspring-boot.run.profiles=h2file 或 h2 回退。
    active: oracle
    group:
      # 只写 demo 时也自动带上 oracle
      demo: oracle

persistence:
  schema-script: classpath:db/schema-dbml-oracle.sql