server:
  port: 8080

spring:
  application:
    name: life-circle-backend
  jpa:
    # 默认按 Oracle 配置；h2 / h2file profile 会覆盖为 H2Dialect
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      # 物理表由 dbdiagram.io 导出的脚本创建，禁止 Hibernate 自动建表
      ddl-auto: none
    properties:
      hibernate:
        # dbdiagram.io 导出的 Oracle DDL 使用带引号的小写标识符，需同样加引号匹配
        globally_quoted_identifiers: true

persistence:
  schema-script: classpath:db/schema-dbml-oracle.sql

app:
  datasource:
    # oracle（默认）| h2 | h2file
    # 由 application-h2.yml / application-h2file.yml 或 -Dspring-boot.run.profiles=... 覆盖
    mode: oracle
    master:
      url: ${ORACLE_MASTER_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
      username: ${ORACLE_MASTER_USERNAME:life_circle}
      password: ${ORACLE_MASTER_PASSWORD:life_circle}
      driver-class-name: oracle.jdbc.OracleDriver
    replica:
      # 未配置独立只读库时回退到主库，方便单机开发
      url: ${ORACLE_REPLICA_URL:${ORACLE_MASTER_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
      username: ${ORACLE_REPLICA_USERNAME:${ORACLE_MASTER_USERNAME:life_circle}}
      password: ${ORACLE_REPLICA_PASSWORD:${ORACLE_MASTER_PASSWORD:life_circle}}
      driver-class-name: oracle.jdbc.OracleDriver
  amap:
    key: ${AMAP_WEB_SERVICE_KEY:}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}