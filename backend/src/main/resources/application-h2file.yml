spring:
  datasource:
    url: jdbc:h2:file:./data/lifecircle;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
  h2:
    console:
      enabled: true

persistence:
  schema-script: classpath:db/schema-dbml-h2.sql
