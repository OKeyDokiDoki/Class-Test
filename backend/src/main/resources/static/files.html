<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件存取演示</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;background:#f1f5f3;color:#203c32;max-width:980px;margin:36px auto;padding:0 20px}section{background:white;padding:24px;margin:20px 0;border-radius:14px}h1,h2{line-height:1.3}button,a{cursor:pointer}button{background:#16795a;color:white;border:0;border-radius:6px;padding:10px 16px;margin:6px}button:disabled{opacity:.5;cursor:wait}input{max-width:95%;padding:8px}progress{width:100%}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;word-break:break-all}#log{white-space:pre-wrap;max-height:220px;overflow:auto}small{color:#52675c}a{color:#16795a}code{font-size:12px}
</style>
<h1>大文件与小文件存取演示</h1>
<p>支持 5 MiB 分片、断点续传、后台合并、SHA-256 校验，以及小文件批量上传与 ZIP 下载。</p>
<section><h2>1. 大文件分片上传</h2>
<input id="large" type="file"><p><input id="hash" placeholder="可选：文件完整 SHA-256（64 位）" size="70"></p>
<button id="upload">开始 / 继续上传</button><button id="pause">暂停</button><button id="cancel" disabled>取消并清理分片</button>
<progress id="progress" value="0" max="100"></progress><p id="state">请选择文件。刷新后重新选择同一个文件，即可继续。</p>
<small>最大 20 GiB；每片 5 MiB。浏览器每次只读取一片，服务器按序流式合并。</small></section>
<section><h2>2. 小文件批量写入</h2><input id="small" type="file" multiple><button id="batch">批量上传</button>
<p><small>每批 1–100 个，每个 ≤ 2 MiB，总计 ≤ 64 MiB；每个文件分别显示成功或失败。</small></p></section>
<section><h2>3. 文件读取</h2><button id="refresh">刷新列表</button><button id="zip">勾选小文件 → ZIP 批量下载</button>
<div style="overflow:auto"><table><thead><tr><th>选择</th><th>文件名 / SHA-256</th><th>大小</th><th>存储</th><th>读取</th></tr></thead><tbody id="files"></tbody></table></div></section>
<section><h2>操作记录</h2><div id="log" role="status"></div></section>
<script type="module">
const $ = id => document.getElementById(id);
let paused = false, running = false, activeUpload = null;
function log(text) { $('log').textContent = `${new Date().toLocaleTimeString()} ${text}\n` + $('log').textContent; }
async function request(path, options = {}) {
  const r = await fetch('/api/files' + path, options);
  const value = await r.json();
  if (!r.ok) { const error = new Error(value.message || value.detail || `HTTP ${r.status}`); error.status = r.status; throw error; }
  return value.data;
}
const json = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
async function digest(blob) {
  const bytes = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
  return Array.from(new Uint8Array(bytes), n => n.toString(16).padStart(2, '0')).join('');
}
async function refresh() {
  const files = await request(''); $('files').replaceChildren();
  for (const file of files) {
    const row = document.createElement('tr');
    const select = document.createElement('input'); select.type = 'checkbox'; select.value = file.id;
    select.dataset.size = file.size; select.disabled = file.size > 2 * 1024 * 1024;
    const first = document.createElement('td'); first.append(select); row.append(first);
    const name = document.createElement('td'); name.textContent = file.name;
    const hash = document.createElement('code'); hash.textContent = file.sha256; name.append(document.createElement('br'), hash); row.append(name);
    for (const text of [(file.size / 1024).toFixed(1) + ' KiB', file.provider]) {
      const td = document.createElement('td'); td.textContent = text; row.append(td);
    }
    const td = document.createElement('td'), link = document.createElement('a');
    link.href = '/api/files/' + file.id + '/download'; link.textContent = '下载'; td.append(link); row.append(td); $('files').append(row);
  }
}
$('upload').onclick = async () => {
  if (running) return;
  const file = $('large').files[0]; if (!file) { log('请先选择大文件。'); return; }
  if (file.size > 20 * 1024 ** 3) { log('文件超过 20 GiB。'); return; }
  const expectedHash = $('hash').value.trim();
  if (expectedHash && !/^[0-9a-f]{64}$/i.test(expectedHash)) { log('完整 SHA-256 格式不正确。'); return; }
  running = true; paused = false; $('upload').disabled = true; $('large').disabled = true; $('cancel').disabled = true;
  try {
    const fingerprint = await digest(new Blob([file.slice(0, 65536), file.slice(Math.max(0, file.size - 65536))]));
    const key = 'file-upload:' + JSON.stringify([file.name, file.size, file.lastModified, fingerprint, expectedHash]);
    let uploadId = localStorage.getItem(key), status;
    if (uploadId) {
      try { status = await request('/uploads/' + uploadId); }
      catch (e) { if (e.status !== 404) throw e; localStorage.removeItem(key); uploadId = null; }
    }
    if (status?.completed) { localStorage.removeItem(key); log('该上传已完成。'); await refresh(); return; }
    if (!uploadId) {
      const session = await request('/uploads', json({ name: file.name, size: file.size, chunkSize: 5 * 1024 * 1024, sha256: expectedHash || null }));
      uploadId = session.id; localStorage.setItem(key, uploadId); status = { session, uploaded: [] };
    }
    const { chunkSize, totalChunks } = status.session, uploaded = new Set(status.uploaded);
    activeUpload = { id: uploadId, key };
    log(`上传会话 ${uploadId}；已收到 ${uploaded.size}/${totalChunks} 片。`);
    $('progress').value = totalChunks ? uploaded.size / totalChunks * 100 : 0;
    for (let i = 0; i < totalChunks; i++) {
      if (paused) { $('state').textContent = '已暂停，再次点击开始即可继续。'; return; }
      const chunk = file.slice(i * chunkSize, Math.min(file.size, (i + 1) * chunkSize));
      const sha256 = await digest(chunk);
      if (uploaded.has(i)) {
        if (status.chunkHashes[i] !== sha256) throw new Error('当前文件与已上传分片不一致，请取消会话后重新上传');
        continue;
      }
      const form = new FormData(); form.append('file', chunk, 'chunk');
      await request(`/uploads/${uploadId}/chunks/${i}?sha256=${sha256}`, { method: 'PUT', body: form });
      uploaded.add(i); $('progress').value = uploaded.size / totalChunks * 100;
      $('state').textContent = `已传 ${uploaded.size}/${totalChunks} 片（${$('progress').value.toFixed(1)}%）`;
    }
    $('state').textContent = '后台正在合并、校验并写入存储，请稍候…';
    const result = await request('/uploads/' + uploadId + '/complete', { method: 'POST' });
    localStorage.removeItem(key); $('progress').value = 100;
    activeUpload = null;
    $('state').textContent = '上传成功；完整 SHA-256：' + result.sha256; log('文件已存入 ' + result.provider); await refresh();
  } catch (e) { log('上传失败：' + e.message + '；可点击继续上传重试。'); }
  finally { running = false; $('upload').disabled = false; $('large').disabled = false; $('cancel').disabled = !activeUpload; }
};
$('pause').onclick = () => { paused = true; log('当前分片结束后暂停。'); };
$('cancel').onclick = async () => {
  if (!activeUpload || running) return;
  try {
    await request('/uploads/' + activeUpload.id, { method: 'DELETE' });
    localStorage.removeItem(activeUpload.key); activeUpload = null; $('cancel').disabled = true;
    $('progress').value = 0; $('state').textContent = '已取消，临时分片已清理。';
  } catch (e) { log(e.message); }
};
$('batch').onclick = async () => {
  const files = Array.from($('small').files);
  if (!files.length || files.length > 100 || files.some(f => f.size > 2 * 1024 ** 2) || files.reduce((n,f) => n+f.size,0) > 64 * 1024 ** 2) {
    log('请选择 1–100 个文件；单个 ≤ 2 MiB，总计 ≤ 64 MiB。'); return;
  }
  $('batch').disabled = true;
  try {
    const form = new FormData(); files.forEach(f => form.append('files', f));
    for (const item of await request('/batch', { method: 'POST', body: form }))
      log(item.name + '：' + (item.file ? '成功 ' + item.file.id : item.error));
    await refresh();
  } catch (e) { log(e.message); } finally { $('batch').disabled = false; }
};
$('zip').onclick = async () => {
  const selected = Array.from($('files').querySelectorAll('input:checked'));
  if (!selected.length || selected.length > 100 || selected.reduce((n,x) => n + Number(x.dataset.size), 0) > 64 * 1024 ** 2) { log('请选择总计 ≤ 64 MiB 的 1–100 个小文件。'); return; }
  $('zip').disabled = true;
  try {
    const r = await fetch('/api/files/batch-download', json(selected.map(x => x.value)));
    if (!r.ok) throw new Error('批量下载失败：HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = 'files.zip'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    log('ZIP 下载完成。');
  } catch (e) { log(e.message); } finally { $('zip').disabled = false; }
};
$('refresh').onclick = () => refresh().catch(e => log(e.message));
refresh().catch(e => log('后端连接失败：' + e.message));
request('/config').then(config => log('当前存储模式：' + config.mode)).catch(e => log(e.message));
</script>
</html>
